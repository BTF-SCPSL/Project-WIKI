name: BTF Wiki Unified Image

on:
  pull_request:
    paths:
      - 'btf-wiki/**'
      - 'editor/**'
      - 'deployment/**'
      - '.dockerignore'
      - 'pterodactyl/egg-btf-unified.json'
      - '.github/workflows/btf-wiki-unified.yml'
  push:
    branches: [main, dev]
    paths:
      - 'btf-wiki/**'
      - 'editor/**'
      - 'deployment/**'
      - '.dockerignore'
      - 'pterodactyl/egg-btf-unified.json'
      - '.github/workflows/btf-wiki-unified.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test deployment/test/*.test.mjs editor/btf-auth/test/*.test.mjs
      - run: node --check deployment/launch.mjs && node --check editor/btf-auth/gateway.mjs
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/btf-scpsl/project-wiki-unified:latest
          cache-from: type=gha,scope=unified
          cache-to: type=gha,scope=unified,mode=max
