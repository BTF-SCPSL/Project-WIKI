name: Import upstream Fumadocs Editor source

on:
  push:
    branches:
      - feat/vendor-fumadocs-editor
    paths:
      - .github/workflows/import-fumadocs-editor.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import pinned MIT-licensed upstream source
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA=46c7086bca2f77bd92fb51cc19871bf48c00e537

          if [[ -e editor/package.json ]]; then
            echo "editor/ is already populated; refusing to overwrite local edits"
            exit 0
          fi

          git init --quiet /tmp/btf-upstream-editor
          git -C /tmp/btf-upstream-editor remote add origin https://github.com/fuma-nama/fumadocs-editor.git
          git -C /tmp/btf-upstream-editor fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C /tmp/btf-upstream-editor checkout --quiet --detach FETCH_HEAD

          mkdir -p editor
          tar --exclude=.git -C /tmp/btf-upstream-editor -cf - . | tar -C editor -xf -
          test -f editor/LICENSE
          test -f editor/packages/ui/package.json
          test -f editor/packages/core/package.json
          test -f editor/packages/studio/package.json
          test -f editor/pnpm-lock.yaml

          git add -A editor
          git diff --cached --stat
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(editor): vendor complete Fumadocs Editor at ${UPSTREAM_SHA}"
          git push origin HEAD:refs/heads/feat/vendor-fumadocs-editor
