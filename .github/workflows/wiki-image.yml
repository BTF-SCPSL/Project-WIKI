name: BTF Wiki Docker image

on:
  pull_request:
    branches: [dev]
    paths:
      - 'btf-wiki/**'
      - 'pterodactyl/egg-btf-wiki.json'
      - '.github/workflows/wiki-image.yml'
  push:
    branches: [dev]
    paths:
      - 'btf-wiki/**'
      - 'pterodactyl/egg-btf-wiki.json'
      - '.github/workflows/wiki-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and publish after merge)
        uses: docker/build-push-action@v6
        with:
          context: ./btf-wiki
          file: ./btf-wiki/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/btf-scpsl/project-wiki:latest
          cache-from: type=gha,scope=btf-wiki
          cache-to: type=gha,mode=max,scope=btf-wiki
